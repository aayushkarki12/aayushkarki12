<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Level 0 DFD - AI Resume System
  </text>
  
  <!-- User Entity -->
  <rect x="50" y="100" width="120" height="80" fill="#e8f4f8" stroke="#2c5aa0" stroke-width="2" rx="5"/>
  <text x="110" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">USER</text>
  <text x="110" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">(External Entity)</text>
  
  <!-- AI Resume System Process -->
  <circle cx="400" cy="300" r="80" fill="#f0f8e8" stroke="#4a7c59" stroke-width="3"/>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI RESUME</text>
  <text x="400" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SYSTEM</text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">(Process 0.0)</text>
  
  <!-- Stripe Entity -->
  <rect x="630" y="450" width="120" height="80" fill="#fff2e8" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="690" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">STRIPE</text>
  <text x="690" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">(Payment Gateway)</text>
  <text x="690" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">(External Entity)</text>
  
  <!-- Data Flow 1: User to System (Resume Input) -->
  <line x1="170" y1="120" x2="340" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="180" font-family="Arial, sans-serif" font-size="11" fill="#333">1. Resume Input Data</text>
  <text x="210" y="195" font-family="Arial, sans-serif" font-size="10" fill="#666">(Personal details, experience, education)</text>
  
  <!-- Data Flow 2: User to System (Payment Info) -->
  <line x1="170" y1="160" x2="340" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="11" fill="#333">2. Subscription/Payment Info</text>
  
  <!-- Data Flow 3: System to Stripe (Payment Request) -->
  <line x1="460" y1="350" x2="630" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="400" font-family="Arial, sans-serif" font-size="11" fill="#333">3. Payment Request</text>
  <text x="505" y="415" font-family="Arial, sans-serif" font-size="10" fill="#666">(Subscription info)</text>
  
  <!-- Data Flow 4: Stripe to System (Confirmation) -->
  <line x1="630" y1="450" x2="460" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="380" font-family="Arial, sans-serif" font-size="11" fill="#333">4. Payment Status</text>
  <text x="520" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666">(Confirmation)</text>
  
  <!-- Data Flow 5: System to User (Resume Output) -->
  <line x1="340" y1="240" x2="170" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="160" font-family="Arial, sans-serif" font-size="11" fill="#333">5. AI-powered Resume</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="300" height="70" fill="none" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Legend:</text>
  <rect x="60" y="545" width="15" height="10" fill="#e8f4f8" stroke="#2c5aa0"/>
  <text x="80" y="554" font-family="Arial, sans-serif" font-size="10">External Entity</text>
  <circle cx="67" cy="570" r="8" fill="#f0f8e8" stroke="#4a7c59"/>
  <text x="80" y="574" font-family="Arial, sans-serif" font-size="10">Process</text>
  <line x1="150" y1="550" x2="180" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="190" y="554" font-family="Arial, sans-serif" font-size="10">Data Flow</text>
</svg>