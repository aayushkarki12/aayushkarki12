<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="crowsfoot" markerWidth="15" markerHeight="10" 
            refX="15" refY="5" orient="auto">
      <path d="M0,5 L10,0 M0,5 L10,10 M10,5 L15,5" stroke="#333" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    Entity Relationship Diagram - AI Resume System
  </text>
  
  <!-- User Entity (Implied) -->
  <rect x="50" y="80" width="200" height="120" fill="#e8f4f8" stroke="#2c5aa0" stroke-width="2" rx="5"/>
  <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">USER</text>
  <line x1="50" y1="110" x2="250" y2="110" stroke="#2c5aa0" stroke-width="1"/>
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="11">🔑 id: String (PK)</text>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="11">email: String</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="11">name: String</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="11">createdAt: DateTime</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="11" fill="#666">(Implied Entity)</text>
  
  <!-- Resume Entity -->
  <rect x="400" y="80" width="250" height="300" fill="#f0f8e8" stroke="#4a7c59" stroke-width="2" rx="5"/>
  <text x="525" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">RESUME</text>
  <line x1="400" y1="110" x2="650" y2="110" stroke="#4a7c59" stroke-width="1"/>
  <text x="410" y="125" font-family="Arial, sans-serif" font-size="11">🔑 id: String (PK)</text>
  <text x="410" y="140" font-family="Arial, sans-serif" font-size="11">🔗 userId: String (FK)</text>
  <text x="410" y="155" font-family="Arial, sans-serif" font-size="11">title: String?</text>
  <text x="410" y="170" font-family="Arial, sans-serif" font-size="11">description: String?</text>
  <text x="410" y="185" font-family="Arial, sans-serif" font-size="11">photoUrl: String?</text>
  <text x="410" y="200" font-family="Arial, sans-serif" font-size="11">colorHex: String (#000000)</text>
  <text x="410" y="215" font-family="Arial, sans-serif" font-size="11">borderStyle: String (squircle)</text>
  <text x="410" y="230" font-family="Arial, sans-serif" font-size="11">summary: String?</text>
  <text x="410" y="245" font-family="Arial, sans-serif" font-size="11">firstName: String?</text>
  <text x="410" y="260" font-family="Arial, sans-serif" font-size="11">lastName: String?</text>
  <text x="410" y="275" font-family="Arial, sans-serif" font-size="11">jobTitle: String?</text>
  <text x="410" y="290" font-family="Arial, sans-serif" font-size="11">city: String?, country: String?</text>
  <text x="410" y="305" font-family="Arial, sans-serif" font-size="11">phone: String?, email: String?</text>
  <text x="410" y="320" font-family="Arial, sans-serif" font-size="11">skills: String[]</text>
  <text x="410" y="335" font-family="Arial, sans-serif" font-size="11">createdAt, updatedAt: DateTime</text>
  
  <!-- WorkExperience Entity -->
  <rect x="800" y="80" width="250" height="200" fill="#fff8e8" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="925" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">WORK_EXPERIENCE</text>
  <line x1="800" y1="110" x2="1050" y2="110" stroke="#d97706" stroke-width="1"/>
  <text x="810" y="125" font-family="Arial, sans-serif" font-size="11">🔑 id: String (PK)</text>
  <text x="810" y="140" font-family="Arial, sans-serif" font-size="11">🔗 resumeId: String (FK)</text>
  <text x="810" y="155" font-family="Arial, sans-serif" font-size="11">position: String?</text>
  <text x="810" y="170" font-family="Arial, sans-serif" font-size="11">company: String?</text>
  <text x="810" y="185" font-family="Arial, sans-serif" font-size="11">startDate: DateTime?</text>
  <text x="810" y="200" font-family="Arial, sans-serif" font-size="11">endDate: DateTime?</text>
  <text x="810" y="215" font-family="Arial, sans-serif" font-size="11">description: String?</text>
  <text x="810" y="230" font-family="Arial, sans-serif" font-size="11">createdAt, updatedAt: DateTime</text>
  
  <!-- Education Entity -->
  <rect x="800" y="320" width="250" height="180" fill="#f8e8ff" stroke="#7c3aed" stroke-width="2" rx="5"/>
  <text x="925" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">EDUCATION</text>
  <line x1="800" y1="350" x2="1050" y2="350" stroke="#7c3aed" stroke-width="1"/>
  <text x="810" y="365" font-family="Arial, sans-serif" font-size="11">🔑 id: String (PK)</text>
  <text x="810" y="380" font-family="Arial, sans-serif" font-size="11">🔗 resumeId: String (FK)</text>
  <text x="810" y="395" font-family="Arial, sans-serif" font-size="11">degree: String?</text>
  <text x="810" y="410" font-family="Arial, sans-serif" font-size="11">school: String?</text>
  <text x="810" y="425" font-family="Arial, sans-serif" font-size="11">startDate: DateTime?</text>
  <text x="810" y="440" font-family="Arial, sans-serif" font-size="11">endDate: DateTime?</text>
  <text x="810" y="455" font-family="Arial, sans-serif" font-size="11">createdAt, updatedAt: DateTime</text>
  
  <!-- UserSubscription Entity -->
  <rect x="50" y="280" width="280" height="220" fill="#ffe8e8" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="190" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">USER_SUBSCRIPTION</text>
  <line x1="50" y1="310" x2="330" y2="310" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="11">🔑 id: String (PK)</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="11">🔗 userId: String (FK, UNIQUE)</text>
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="11">🔒 stripeCustomerId: String (UNIQUE)</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="11">🔒 stripeSubscriptionId: String (UNIQUE)</text>
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="11">stripePriceId: String</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="11">stripeCurrentPeriodEnd: DateTime</text>
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="11">stripeCancelAtPeriodEnd: Boolean</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="11">(default: false)</text>
  <text x="60" y="445" font-family="Arial, sans-serif" font-size="11">createdAt, updatedAt: DateTime</text>
  
  <!-- Relationships -->
  
  <!-- User to Resume (1:N) -->
  <line x1="250" y1="140" x2="400" y2="140" stroke="#333" stroke-width="2"/>
  <circle cx="250" cy="140" r="3" fill="#333"/>
  <line x1="390" y1="135" x2="400" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="390" y1="145" x2="400" y2="140" stroke="#333" stroke-width="2"/>
  <text x="310" y="135" font-family="Arial, sans-serif" font-size="10" fill="#333">1:N</text>
  <text x="290" y="155" font-family="Arial, sans-serif" font-size="9" fill="#666">has</text>
  
  <!-- User to UserSubscription (1:1) -->
  <line x1="150" y1="200" x2="150" y2="280" stroke="#333" stroke-width="2"/>
  <circle cx="150" cy="200" r="3" fill="#333"/>
  <circle cx="150" cy="280" r="3" fill="#333"/>
  <text x="160" y="240" font-family="Arial, sans-serif" font-size="10" fill="#333">1:1</text>
  <text x="110" y="240" font-family="Arial, sans-serif" font-size="9" fill="#666">subscribes</text>
  
  <!-- Resume to WorkExperience (1:N) -->
  <line x1="650" y1="160" x2="800" y2="160" stroke="#333" stroke-width="2"/>
  <circle cx="650" cy="160" r="3" fill="#333"/>
  <line x1="790" y1="155" x2="800" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="790" y1="165" x2="800" y2="160" stroke="#333" stroke-width="2"/>
  <text x="710" y="155" font-family="Arial, sans-serif" font-size="10" fill="#333">1:N</text>
  <text x="700" y="175" font-family="Arial, sans-serif" font-size="9" fill="#666">includes</text>
  <text x="700" y="185" font-family="Arial, sans-serif" font-size="8" fill="#999">CASCADE DELETE</text>
  
  <!-- Resume to Education (1:N) -->
  <line x1="650" y1="300" x2="800" y2="380" stroke="#333" stroke-width="2"/>
  <circle cx="650" cy="300" r="3" fill="#333"/>
  <line x1="790" y1="375" x2="800" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="790" y1="385" x2="800" y2="380" stroke="#333" stroke-width="2"/>
  <text x="710" y="335" font-family="Arial, sans-serif" font-size="10" fill="#333">1:N</text>
  <text x="700" y="350" font-family="Arial, sans-serif" font-size="9" fill="#666">includes</text>
  <text x="700" y="360" font-family="Arial, sans-serif" font-size="8" fill="#999">CASCADE DELETE</text>
  
  <!-- Legend -->
  <rect x="50" y="550" width="400" height="180" fill="none" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Legend:</text>
  
  <text x="60" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Symbols:</text>
  <text x="70" y="605" font-family="Arial, sans-serif" font-size="10">🔑 Primary Key (PK)</text>
  <text x="70" y="620" font-family="Arial, sans-serif" font-size="10">🔗 Foreign Key (FK)</text>
  <text x="70" y="635" font-family="Arial, sans-serif" font-size="10">🔒 Unique Constraint</text>
  <text x="70" y="650" font-family="Arial, sans-serif" font-size="10">? Nullable Field</text>
  
  <text x="250" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Relationships:</text>
  <circle cx="260" cy="602" r="3" fill="#333"/>
  <text x="270" y="607" font-family="Arial, sans-serif" font-size="10">One (1)</text>
  <line x1="250" y1="615" x2="270" y2="615" stroke="#333" stroke-width="2"/>
  <line x1="265" y1="612" x2="270" y2="615" stroke="#333" stroke-width="1"/>
  <line x1="265" y1="618" x2="270" y2="615" stroke="#333" stroke-width="1"/>
  <text x="275" y="620" font-family="Arial, sans-serif" font-size="10">Many (N)</text>
  
  <text x="60" y="675" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Data Types:</text>
  <text x="70" y="690" font-family="Arial, sans-serif" font-size="10">String - Text data (CUID for IDs)</text>
  <text x="70" y="705" font-family="Arial, sans-serif" font-size="10">DateTime - Timestamp data</text>
  <text x="70" y="720" font-family="Arial, sans-serif" font-size="10">Boolean - True/False values</text>
</svg>